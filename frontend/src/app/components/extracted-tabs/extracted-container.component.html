<!-- src/app/extracted/extracted-container.component.html -->

<ng-container *ngIf="files.length > 0; else noFiles">
  <!-- 1) the tabs bar with + -->
  <app-extracted-tabs
    [files]="files"
    [(selectedIndex)]="selectedIndex"
    (selectedIndexChange)="onTabSelected($event)"
    (plusClick)="onAddMore()"
  >
  </app-extracted-tabs>

  <!-- 2) if they clicked +, show the inline uploader -->
  <div *ngIf="addingMore" class="mt-4">
    <app-upload-doc
      [mode]="'embedded'"
      (extracted)="onNewDocuments($event)"
      (close)="addingMore = false"
    >
    </app-upload-doc>
  </div>

  <!-- 3) otherwise show the detail panel or skeleton -->
  <main *ngIf="!addingMore" class="mt-4 position-relative">
    <!-- ********** SHOW THE SKELETON PLACEHOLDERS WHILE LOADING ********** -->
    <ng-container *ngIf="isLoading">
      <div class="skeleton-wrapper">
        <!-- Prescription Skeleton -->
        <ng-container *ngIf="files[selectedIndex].type === 'prescription'">
          <div class="px-3">
            <!-- Simulate Pharmacy / Patient Info rows -->
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="skeleton rounded" style="height: 1.5rem; width: 60%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 90%;"></div>
              </div>
              <div class="col-md-6">
                <div class="skeleton rounded" style="height: 1.5rem; width: 50%; margin-bottom: 0.5rem;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 80%;"></div>
              </div>
            </div>

            <!-- Simulate Executor & CNAM line -->
            <div class="row mb-4">
              <div class="col-md-6">
                <div class="skeleton rounded" style="height: 1.5rem; width: 40%;"></div>
              </div>
              <div class="col-md-6">
                <div class="skeleton rounded" style="height: 1.5rem; width: 70%;"></div>
              </div>
            </div>

            <!-- Simulate Buttons Row -->
            <div style="margin-bottom: 1rem;">
              <div class="d-inline-block skeleton rounded" style="height: 2rem; width: 6rem; margin-right: 1rem;"></div>
              <div class="d-inline-block skeleton rounded" style="height: 2rem; width: 10rem;"></div>
            </div>

            <!-- Simulate Table Header -->
            <div class="skeleton rounded" style="height: 2.5rem; width: 100%; margin-bottom: 0.5rem;"></div>

            <!-- Simulate 4 table rows -->
            <ng-container *ngFor="let row of [1,2,3,4]">
              <div class="d-flex mb-2">
                <div class="skeleton rounded" style="height: 1.5rem; width: 12%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 20%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 10%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 10%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 15%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 15%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 10%; margin-right: 1%;"></div>
                <div class="skeleton rounded" style="height: 1.5rem; width: 10%;"></div>
              </div>
            </ng-container>

            <!-- Simulate Total In Words -->
            <div class="skeleton rounded" style="height: 3rem; width: 60%; margin: 1.5rem 0;"></div>

            <!-- Simulate Signature Box -->
            <div class="skeleton rounded" style="height: 6rem; width: 30%;"></div>
          </div>
        </ng-container>

        <!-- Bulletin Skeleton -->
        <ng-container *ngIf="files[selectedIndex].type === 'bulletin'">
          <div class="px-3">
            <!-- Simulate first page header -->
            <div class="skeleton rounded" style="height: 2rem; width: 50%; margin-bottom: 1rem;"></div>
            <div class="row">
              <div class="col-md-6">
                <!-- Many rows/fields to mimic left‐column -->
                <ng-container *ngFor="let i of [1,2,3,4]">
                  <div class="skeleton rounded mb-2" style="height: 1.5rem; width: 80%;"></div>
                </ng-container>
                <div class="skeleton rounded" style="height: 6rem; width: 100%; margin-top: 1rem;"></div>
              </div>
              <div class="col-md-6">
                <!-- Many rows/fields to mimic right‐column -->
                <ng-container *ngFor="let i of [1,2,3,4]">
                  <div class="skeleton rounded mb-2" style="height: 1.5rem; width: 90%;"></div>
                </ng-container>
                <div class="skeleton rounded" style="height: 4rem; width: 100%; margin-top: 1rem;"></div>
              </div>
            </div>
            <!-- Simulate multiple table sections on second page: -->
            <div class="skeleton rounded" style="height: 2rem; width: 40%; margin: 2rem 0 1rem 0;"></div>
            <ng-container *ngFor="let t of [1,2,3]">
              <div class="skeleton rounded mb-2" style="height: 1.5rem; width: 100%;"></div>
            </ng-container>
          </div>
        </ng-container>
      </div>
    </ng-container>

    <!-- ********** ONCE loading is false, show the REAL COMPONENTS ********** -->
    <ng-container *ngIf="!isLoading">
      <ng-container [ngSwitch]="files[selectedIndex].type">
        <app-prescription
          *ngIf="loadedPrescription"
          [prescription]="loadedPrescription!"
          [fileId]="files[selectedIndex].id"
        >
        </app-prescription>
        <ng-container *ngSwitchCase="'bulletin'">
          <app-bulletin
            *ngIf="loadedBulletin"
            [data]="loadedBulletin"
            [fileId]="files[selectedIndex].id"
            (updated)="loadCurrent()"
          ></app-bulletin>
        </ng-container>
      </ng-container>
    </ng-container>
  </main>
</ng-container>

<ng-template #noFiles>
  <div class="alert alert-info" align="center">
    No documents to display. Please upload first.
  </div>
</ng-template>
