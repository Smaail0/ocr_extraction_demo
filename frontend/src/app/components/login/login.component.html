<div class="auth-container">
  <div class="auth-card">
    <!-- 1) Centered logo wrapper -->
    <div class="auth-logo">
      <img src="/image.png" alt="Logo" />
    </div>

    <h2 class="auth-title">Se connecter</h2>
    <p class="auth-subtitle">Veuillez se connecter pour continuer.</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <!-- Email field -->
      <div class="form-group">
        <input
          formControlName="email"
          type="text"
          placeholder="Email"
          class="input-field"
        />
        <div
          *ngIf="
            loginForm.get('email')?.touched && loginForm.get('email')?.invalid
          "
          class="error"
        >
          Veuillez entrer un email valide.
        </div>
      </div>

      <!-- Password + toggle -->
      <div class="form-group password-group">
        <input
          formControlName="password"
          [type]="showPassword ? 'text' : 'password'"
          placeholder="Mot de passe"
          class="input-field"
        />
        <button
          type="button"
          class="toggle-password"
          (click)="toggleShowPassword()"
        >
          {{ showPassword ? "Masquer" : "Afficher" }}
        </button>
        <div
          *ngIf="
            loginForm.get('password')?.touched &&
            loginForm.get('password')?.invalid
          "
          class="error"
        >
          Veuillez entrer un mot de passe valide.
        </div>
      </div>

      <div class="forgot-password">
        <a href="#" (click)="onForgotPassword($event)">
          Mot de passe oublié ?
        </a>
      </div>

      <button type="submit" class="btn-primary" [disabled]="loginForm.invalid">
        Se connecter
        <span class="loading-spinner" *ngIf="loading"></span>
      </button>

      <div class="forgot-password">
        <a href="#" (click)="onForgotPassword($event)">
          Mot de passe oublié ?
        </a>
      </div>
    </form>
  </div>
</div>
